# Local hybrid overlay — publish backing-service ports to the host.
# Apps (web / admin / api) run on the host, not in Docker.
#
#   ./scripts/compose.sh infra up -d

services:

  db:
    ports:
      - "${HOST_POSTGRES_PORT}:${CONTAINER_POSTGRES_PORT}"

  search:
    ports:
      - "${HOST_MEILI_PORT}:${CONTAINER_MEILI_PORT}"
    environment:
      MEILI_ENV: development

  storage:
    ports:
      - "${HOST_GARAGE_S3_PORT}:${CONTAINER_GARAGE_S3_PORT}"
      - "${HOST_GARAGE_ADMIN_PORT}:${CONTAINER_GARAGE_ADMIN_PORT}"
