# Base stack — all environments. Ports come from `.env.compose` (CONTAINER_* / HOST_*).
#
# Local development (default): start only backing services
#   ./scripts/compose.sh infra up -d
#
# Production / full Docker: apps + nginx + infra
#   ./scripts/compose.sh prod up -d --build

name: imperial-press

services:

  web:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_MEILISEARCH_HOST: ${NEXT_PUBLIC_MEILISEARCH_HOST}
        NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY: ${NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY}
        NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
        CONTAINER_WEB_PORT: ${CONTAINER_WEB_PORT}
    image: imperial-press/web:latest
    networks: [imperial-press-network]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_MEILISEARCH_HOST: ${NEXT_PUBLIC_MEILISEARCH_HOST}
      NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY: ${NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
      PORT: ${CONTAINER_WEB_PORT}
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_started

  admin:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: infra/docker/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/admin}
        CONTAINER_ADMIN_PORT: ${CONTAINER_ADMIN_PORT}
    image: imperial-press/admin:latest
    networks: [imperial-press-network]

  api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
      args:
        CONTAINER_API_PORT: ${CONTAINER_API_PORT}
    image: imperial-press/api:latest
    networks: [imperial-press-network]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${DB_PASSWORD}@db:${CONTAINER_POSTGRES_PORT}/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      MEILISEARCH_URL: http://search:${CONTAINER_MEILI_PORT}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILISEARCH_SEARCH_KEY: ${MEILISEARCH_SEARCH_KEY}
      GARAGE_ENDPOINT: http://storage:${CONTAINER_GARAGE_S3_PORT}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_REGION: ${GARAGE_REGION:-garage}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@imperialpress.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_healthy
      storage:
        condition: service_started

  db:
    image: postgres:18-alpine
    networks: [imperial-press-network]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: ${CONTAINER_POSTGRES_PORT}
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${CONTAINER_POSTGRES_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  search:
    image: getmeili/meilisearch:v1.48
    networks: [imperial-press-network]
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_HTTP_ADDR: 0.0.0.0:${CONTAINER_MEILI_PORT}
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${CONTAINER_MEILI_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: dxflrs/garage:v2.3.0
    networks: [imperial-press-network]
    volumes:
      - garagedata:/var/lib/garage
      - ../garage/garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    command: ["/garage", "server", "--single-node"]

  nginx:
    profiles: ["full"]
    image: nginx:1.27-alpine
    networks: [imperial-press-network]
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/admin}
      CONTAINER_WEB_PORT: ${CONTAINER_WEB_PORT}
      CONTAINER_ADMIN_PORT: ${CONTAINER_ADMIN_PORT}
      CONTAINER_GARAGE_WEB_PORT: ${CONTAINER_GARAGE_WEB_PORT}
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates-dev:/etc/nginx/templates:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - web
      - admin
      - api
      - storage

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    networks: [imperial-press-network]
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot

networks:
  imperial-press-network:
    name: Imperial-press-network
    driver: bridge

volumes:
  pgdata:
  meilidata:
  garagedata:
  certbot-certs:
  certbot-www:
